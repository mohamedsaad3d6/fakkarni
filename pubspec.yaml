name: fakkarni
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  drift: ^2.34.3
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.3
  # دارت خالص — بنصغّر بيها الصورة قبل ما تتبعت لـGemini (C1). كانت جاية
  # أصلاً مع image_picker، وبقت مثبّتة بالاسم عشان تصغير الصورة مش تفصيلة
  # تابعة لحزمة تانية تقدر تشيلها.
  image: ^4.10.1
  supabase_flutter: ^2.17.2
  google_sign_in: ^7.2.0
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  sqlite3: ^3.5.2
  # عدّاد المية (D3.2) — تلات أرقام محلية. كانت متحمّلة أصلاً من supabase_flutter.
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  # منتقي جهة اتصال **من النظام** (D3.4 / جولة ٢٣) — مقصود إنه الحزمة دي
  # بالذات: بتفتح شاشة النظام وبترجّع **جهة واحدة** اللي الشخص اختارها،
  # ومفيهاش API يعدّد دفتر العناوين أصلاً. يعني القاعدة («بنقرا الواحدة
  # اللي المنتقي رجّعها وبس») مش وعد في الكود — مفيش طريق تانية من أصله.
  #
  # **نسخة مثبّتة بالظبط، من غير ^ — والفرق ده مقصود.** دي الحزمة الوحيدة
  # اللي بتقف جنب دفتر عناوين الناس، والسلوك اللي إحنا معتمدين عليه (شاشة
  # نظام، جهة واحدة، من غير إذن، من غير تعديد) ممكن يتغيّر في نسخة صغيرة
  # من غير ما حد ياخد باله — وقتها التطبيق يبقى بيطلب إذن جهات الاتصال
  # ومحدش قرر ده. الترقية بالإيد، وبقراية الفرق، ومعاها جولة على الجهاز.
  flutter_native_contact_picker: 0.0.12
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  in_app_purchase: ^3.3.0
  audioplayers: ^6.8.1
  flutter_tts: ^4.2.5
  audio_session: ^0.2.4
  speech_to_text: ^7.5.0
  # النسخة الحقيقية من الحزمة (pubspec → Info.plist) — «النسخة» في الإعدادات والنبضة
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  image_picker_platform_interface: ^2.11.1
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4
  yaml: ^3.1.4

# الأيقونة على المنصتين — `dart run flutter_launcher_icons`. الملفين مرسومين
# من مسارات SVG بتاعة العلامة (design/handoff/README.md): المِعلَم ٦٨٪ على
# #0A4638، والـforeground مصغّر لـ٤٥.٥٪ عشان يفضل جوه منطقة أمان أندرويد.
# test/app/branding_test.dart بيقع لو مسار هنا اتغيّر لملف مش موجود.
flutter_launcher_icons:
  image_path: assets/branding/icon-1024.png
  android: true
  ios: true
  adaptive_icon_background: "#0A4638"
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  # الـforeground مصغّر لمنطقة الأمان في الملف نفسه (٤٥.٥٪) — الـinset
  # الافتراضي (١٦٪) كان هيصغّره تاني لحوالي ٣١٪ من الطبقة.
  adaptive_icon_foreground_inset: 0
  # App Store بيرفض أي شفافية في الأيقونة
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # الخطوط متحزّمة مع التطبيق — مش بتتحمّل وقت التشغيل (design/PORT_PLAN.md D1).
  # Alexandria على Google Fonts variable بس؛ الملفّين هنا static اتقطعوا منه
  # بـfontTools (wght=500 و700) عشان Bold يبان مختلف عن Medium فعلاً.
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

  # To add assets to your application, add an assets section, like this:
  assets:
    # تسجيلات «الرفيق الصوتي» — ٤٦ ملف، صوت راجل مصري، بتاعتنا
    - assets/voices/
    # نغمة «سامعك» — speech_to_text على iOS بيشغّلها بنفسه لحظة فتح المايك
    - assets/sounds/

  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
